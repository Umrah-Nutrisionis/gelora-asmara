<style>
/* Layout: aplikasi satu kolom ramah ponsel — kartu umur di atas, navigasi bawah di ponsel, navigasi atas di layar lebar */
:root{
  --bg:#FFF5F9;        /* latar merah muda pucat */
  --surface:#FFFFFF;
  --soft:#FCE3EE;      /* pink lembut */
  --ink:#2B1A23;
  --muted:#6E5462;
  --line:#F2D3E1;
  --kelor:#D63F86;     /* pink Buku KIA (utama) */
  --kelor-ink:#FFFFFF;
  --labu:#E07A1F;      /* oranye (aksen tombol) */
  --labu-soft:#FDEBDA;
  --laut:#7A3E9D;      /* ungu (tautan) */
  --laut-soft:#F1E6F7;
  --warn:#B4441F;
  --ok:#2E7D4F;--ok-soft:#E3F3E8;--mid:#A2620A;--mid-soft:#FBF0D9;--bad:#B3261E;--bad-soft:#FBE4E2;
  --font-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --skala:1;
  /* ukuran huruf menyesuaikan layar: 17px di ponsel, naik bertahap sampai 20px di komputer */
  --fs:calc(var(--skala) * clamp(17px, 15.6px + .36vw, 20px));
  --radius:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1218;--surface:#261A21;--soft:#3A2230;--ink:#F6E9EF;--muted:#C4A9B7;--line:#4A2F3D;
  --kelor:#F27AB0;--kelor-ink:#2A0F1C;--labu:#F0A05A;--labu-soft:#3A2A1C;--laut:#C79BE3;--laut-soft:#33233D;--warn:#F08A66;--ok:#7BD39A;--ok-soft:#1E3326;--mid:#F2C14E;--mid-soft:#3A2F14;--bad:#FF8A80;--bad-soft:#3D1D1C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1218;--surface:#261A21;--soft:#3A2230;--ink:#F6E9EF;--muted:#C4A9B7;--line:#4A2F3D;
  --kelor:#F27AB0;--kelor-ink:#2A0F1C;--labu:#F0A05A;--labu-soft:#3A2A1C;--laut:#C79BE3;--laut-soft:#33233D;--warn:#F08A66;--ok:#7BD39A;--ok-soft:#1E3326;--mid:#F2C14E;--mid-soft:#3A2F14;--bad:#FF8A80;--bad-soft:#3D1D1C;color-scheme:dark}
html.besar{--skala:1.18}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs);line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2em}h2{font-size:1.55em}h3{font-size:1.2em}
p{margin:0}
a{color:var(--laut)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--labu);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--kelor);display:grid;place-items:center;flex:none}
.logo b{font-family:var(--font-display);font-size:1.3em;line-height:1}
.logo small{display:block;font-size:.68em;color:var(--muted);font-weight:700;letter-spacing:.02em}
.topnav{display:flex;gap:4px}
.topnav a,.botnav a{text-decoration:none;color:var(--muted);font-weight:700;border-radius:12px}
.topnav a{padding:8px 12px}
.topnav a[aria-current="page"]{background:var(--soft);color:var(--kelor)}
.ukuran{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-weight:800;cursor:pointer;min-height:40px}
.ukuran[aria-pressed="true"]{background:var(--labu-soft);border-color:var(--labu)}

/* bottom nav (ponsel) */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.botnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72em}
.botnav svg{width:24px;height:24px}
.botnav a[aria-current="page"]{color:var(--kelor);background:var(--soft)}
@media (min-width:760px){.botnav{display:none}}
@media (max-width:759px){.topnav{display:none} main{padding-bottom:96px}}

main{padding-block:20px 40px}
.view{display:grid;gap:20px}
.lead{font-size:1.08em;color:var(--muted);max-width:62ch}

/* hero beranda */
.hero{background:var(--kelor);color:var(--kelor-ink);border-radius:24px;padding:24px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero p{max-width:52ch;opacity:.95}
.hero .tag{font-weight:800;font-size:.8em;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero svg.deco{position:absolute;right:-30px;bottom:-30px;width:180px;height:180px;opacity:.18}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:800;text-decoration:none;cursor:pointer;min-height:48px}
.btn-labu{background:var(--labu);color:#fff}
.btn-line{background:transparent;border:2px solid currentColor;color:inherit}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* pilih umur */
.umur{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:10px}
.umur-label{font-weight:800}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 6px;cursor:pointer;font-weight:800;min-height:56px;line-height:1.2}
.seg button small{display:block;font-weight:600;color:var(--muted);font-size:.75em}
.seg button[aria-pressed="true"]{border-color:var(--kelor);background:var(--soft);color:var(--kelor)}

/* kartu ringkas */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:6px;min-width:0}
a.card{text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
a.card:hover{border-color:var(--kelor);transform:translateY(-2px)}
.num{font-family:var(--font-display);font-weight:800;color:var(--labu);font-size:.95em}
.card p{color:var(--muted);font-size:.92em}

/* angka porsi */
.porsi{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:4px}
.stat .k{font-size:.8em;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:var(--font-display);font-size:1.45em;font-weight:800;color:var(--kelor);line-height:1.15}
.stat .s{font-size:.88em;color:var(--muted)}
.mangkuk{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 14px}
.mangkuk svg{flex:none}

/* artikel materi */
.artikel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:14px;min-width:0}
.artikel ul,.artikel ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.inti{background:var(--labu-soft);border-radius:14px;padding:12px 14px;font-weight:700}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.92em}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:800}
tr:last-child td{border-bottom:0}
.dua{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.box{border-radius:14px;padding:14px;display:grid;gap:8px}
.box.ya{background:var(--soft)}.box.tidak{background:var(--labu-soft)}
.box h3{font-size:1.05em}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;text-decoration:none;color:var(--kelor)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager a{font-weight:800;text-decoration:none;color:var(--laut)}

/* mitos */
.mitos{display:grid;gap:10px}
.mf{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mf .m{padding:10px 14px;background:var(--labu-soft)}
.mf .f{padding:10px 14px}
.lbl{font-size:.75em;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.m .lbl{color:var(--warn)}.f .lbl{color:var(--kelor)}

/* menu */
.menu-hari{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:120px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;align-items:baseline}
.slot .w{font-weight:800;color:var(--laut)}
@media (max-width:420px){.slot{grid-template-columns:1fr;gap:2px}}

/* resep */
details.resep{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
details.resep summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.resep summary::-webkit-details-marker{display:none}
details.resep summary .t{font-family:var(--font-display);font-size:1.15em;font-weight:700;margin-right:auto}
.chip{font-size:.75em;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--laut-soft);color:var(--laut);white-space:nowrap}
.resep .isi{padding:0 16px 16px;display:grid;gap:12px}
.gizi{display:flex;flex-wrap:wrap;gap:8px}
.gizi span{background:var(--soft);border-radius:10px;padding:6px 10px;font-weight:700;font-size:.88em;font-variant-numeric:tabular-nums}
.plus{transition:transform .2s;color:var(--kelor);font-weight:800;font-size:1.4em;line-height:1}
details[open] .plus{transform:rotate(45deg)}

/* tanya */
form{display:grid;gap:12px}
label{font-weight:800;display:grid;gap:6px}
input,select,textarea{font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:110px;resize:vertical}
.pratinjau{white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:14px;font-size:.92em}
.nomor{font-family:var(--font-display);font-size:1.4em;font-weight:800;color:var(--kelor);user-select:all}
.faq details{border-bottom:1px solid var(--line);padding-block:12px}
.faq summary{cursor:pointer;font-weight:800}
.faq p{margin-top:8px;color:var(--muted)}
.catatan{font-size:.85em;color:var(--muted)}
/* ilustrasi */
.hero{grid-template-columns:1fr}
.hero-ilus{width:min(260px,70%);justify-self:center}
@media (min-width:700px){.hero{grid-template-columns:1.3fr 1fr;align-items:center}.hero-ilus{width:100%}}
.ic{width:48px;height:48px}
.tekstur3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.tekstur3 figure{margin:0;display:grid;gap:4px;justify-items:center;background:var(--bg);border-radius:14px;padding:10px 6px}
.tekstur3 svg{width:100%;max-width:110px}
.tekstur3 figcaption{font-size:.85em;font-weight:700;line-height:1.3}
.tekstur3 figcaption b{display:block;color:var(--kelor)}
.piring-wrap{display:grid;gap:14px;align-items:center}
.piring-wrap svg{width:min(220px,80%);justify-self:center}
@media (min-width:640px){.piring-wrap{grid-template-columns:220px 1fr}.piring-wrap svg{width:100%}}
.wajah svg{width:110px;height:auto}
.kunci{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kunci figure{margin:0;background:var(--bg);border-radius:14px;padding:12px;display:grid;gap:6px;justify-items:center;text-align:center}
.kunci svg{width:56px;height:56px}
.kunci figcaption{font-size:.88em;font-weight:700}
.resep-ilus{width:72px;flex:none}
.mangkuk-besar svg{width:96px;flex:none}
.ingat{background:var(--soft);border:2px dashed var(--kelor);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.ingat h3{color:var(--kelor)}
.btn-video{display:inline-flex;align-items:center;gap:8px}
.btn-video svg{width:16px;height:16px;fill:currentColor}
.video-materi{font-weight:700;color:var(--kelor);text-decoration:none;font-size:.92em}
.kal{background:var(--surface);border:2px solid var(--kelor);border-radius:18px;padding:16px;display:grid;gap:12px}
.kal h2{margin:0}
.kal .lead{margin:0;font-size:.95em}
.kal form{display:grid;gap:12px}
.kal .dua{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kal .jk{display:flex;gap:8px;flex-wrap:wrap}
.kal .jk label{display:flex;align-items:center;gap:8px;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer}
.kal .jk input{width:auto;accent-color:var(--kelor)}
.kal .jk label:has(input:checked){border-color:var(--kelor);background:var(--soft)}
.kal fieldset{border:0;padding:0;margin:0;display:grid;gap:6px}
.kal legend{font-weight:800;margin-bottom:6px}
.kal .hint{font-weight:600;font-size:.82em;color:var(--muted)}
.kal button.hitung{background:var(--kelor);color:var(--kelor-ink);border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}
.hasil{display:grid;gap:10px}
.hasil .umur{font-weight:700;color:var(--muted)}
.ind{border-radius:14px;padding:12px 14px;display:grid;gap:4px;border-left:6px solid}
.ind .k{font-size:.85em;font-weight:700;opacity:.85}
.ind .v{font-family:var(--font-display);font-size:1.25em;font-weight:800;line-height:1.2}
.ind .z{font-size:.85em}
.ind.ok{background:var(--ok-soft);border-color:var(--ok)}.ind.ok .v{color:var(--ok)}
.ind.mid{background:var(--mid-soft);border-color:var(--mid)}.ind.mid .v{color:var(--mid)}
.ind.bad{background:var(--bad-soft);border-color:var(--bad)}.ind.bad .v{color:var(--bad)}
.hasil .saran-gizi{background:var(--soft);border-radius:14px;padding:12px 14px}
.kal .err{color:var(--bad);font-weight:700}
.kal small{color:var(--muted)}
@media (max-width:420px){.kal .dua{grid-template-columns:1fr}}
.pasang{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:16px;padding:12px 14px}
.pasang .ic{flex:0 0 48px;height:48px;border-radius:12px;background:var(--kelor);display:grid;place-items:center}
.pasang .ic svg{width:28px;height:28px}
.pasang b{display:block}
.pasang p{margin:2px 0 0;font-size:.9em}
.pasang .btn{min-height:40px;padding:8px 14px;background:var(--kelor);color:var(--kelor-ink);margin-left:auto;flex:0 0 auto}
@media (max-width:420px){.pasang{flex-wrap:wrap}.pasang .btn{margin-left:0;width:100%}}
.cari{background:var(--surface);border:2px solid var(--kelor);border-radius:16px;padding:14px;display:grid;gap:10px}
.cari h2{margin:0;font-size:1.15em}
.cari form{display:flex;gap:8px}
.cari input{flex:1;min-width:0}
.cari button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--kelor);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.cari button svg{width:18px;height:18px}
.cari .saran{display:flex;flex-wrap:wrap;gap:6px}
.cari .saran a{background:var(--soft);color:var(--kelor);text-decoration:none;font-weight:700;font-size:.85em;border-radius:999px;padding:6px 12px}
.cari small{opacity:.75}
.imun td:first-child,.imun th:first-child{white-space:nowrap;font-weight:700}
.video-wrap{display:grid;gap:10px;margin-top:6px}
.video-wrap+.video-wrap{margin-top:22px}
.video-card{display:flex;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--soft);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit}
.video-card:hover,.video-card:focus-visible{border-color:var(--kelor)}
.video-card .play{flex:0 0 52px;height:52px;border-radius:12px;background:var(--kelor);display:grid;place-items:center}
.video-card .play svg{width:22px;height:22px;fill:#fff;margin-left:3px}
.video-card .t{font-weight:700;line-height:1.3;display:block}
.video-card .c{font-size:.85em;opacity:.75;display:block;margin-top:2px}
.video-note{font-size:.85em;opacity:.75}
/* foto Kemenkes */
.foto{margin:0;display:grid;gap:6px}
.foto img{width:100%;height:auto;border-radius:14px;display:block;background:var(--soft)}
.foto figcaption{font-size:.82em;color:var(--muted)}
.hero .foto img{border-radius:18px;border:4px solid rgba(255,255,255,.6)}
.hero .foto figcaption{color:var(--kelor-ink);opacity:.85}
.pangan{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.pangan figure{margin:0;background:var(--bg);border-radius:14px;overflow:hidden;display:grid}
.pangan img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;display:block}
.pangan figcaption{padding:8px 10px;font-size:.88em;font-weight:700}
.kunci img{width:100%;max-width:150px;height:auto;aspect-ratio:1;object-fit:cover;border-radius:12px}
.porsi-foto{display:grid;gap:14px;align-items:start}
.porsi-foto .foto{max-width:260px;justify-self:center}
@media (min-width:640px){.porsi-foto{grid-template-columns:240px 1fr}}
.side{display:grid;gap:14px;align-items:center}
@media (min-width:640px){.side{grid-template-columns:1fr 1fr}}
footer{padding-block:10px 30px;color:var(--muted);font-size:.85em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Penyesuaian tablet dan komputer ===== */
h1{font-size:clamp(1.75em, 1.45em + 1vw, 2.3em)}
.hero h1{font-size:clamp(1.9em, 1.5em + 1.6vw, 2.8em)}
.view.baca{max-width:880px;margin-inline:auto;width:100%}
.card{align-content:start}
.kal .dua{align-items:start}
h1{font-size:clamp(1.85em, 1.5em + 1vw, 2.3em)}
.topnav a.nav-video{display:none}
/* tablet (760–1023px): navigasi bawah tetap dipakai agar tombol besar dan mudah disentuh */

const MATERI = [
 {id:1, judul:"Mengenal PMBA", ringkas:"Apa itu PMBA, mengapa penting, dan empat prinsip pemberian MP-ASI.", isi:`
  <p class="inti">Pemberian Makan Bayi dan Anak (PMBA) adalah cara memberi ASI dan Makanan Pendamping ASI (MP-ASI) yang sesuai umur, kebutuhan gizi, dan tahap perkembangan anak.</p>
  <p>Masa sejak dalam kandungan sampai anak berusia 2 tahun adalah periode emas sekaligus periode kritis. Kekurangan gizi pada masa ini dapat mengganggu pertumbuhan dan perkembangan anak secara permanen.</p>
  <h3>Tujuan PMBA</h3>
  <ul><li>Mencukupi zat gizi anak sesuai umurnya.</li><li>Mencegah anak pendek (<i>stunting</i>), berat badan kurang, dan kurus.</li><li>Membentuk kebiasaan makan yang sehat sejak dini.</li></ul>
  <h3>Empat prinsip pemberian MP-ASI</h3>
  <div class="grid">
   <a class="card" href="#materi-2"><span class="num">1. Tepat waktu</span><p>Dimulai tepat usia 6 bulan, saat ASI saja tidak lagi cukup.</p></a>
   <a class="card" href="#materi-3"><span class="num">2. Adekuat</span><p>Cukup energi, protein, dan zat gizi mikro, dengan jumlah, frekuensi, tekstur, dan variasi sesuai umur.</p></a>
   <a class="card" href="#materi-6"><span class="num">3. Aman dan bersih</span><p>Disiapkan, disimpan, dan diberikan dengan tangan serta alat yang bersih.</p></a>
   <a class="card" href="#materi-7"><span class="num">4. Cara yang benar</span><p>Terjadwal, suasana mendukung, dan responsif terhadap tanda lapar dan kenyang.</p></a>
  </div>
  <p>ASI tetap diberikan sampai anak berusia 2 tahun atau lebih.</p>`},
 {id:2, judul:"Waktu Pemberian MP-ASI", ringkas:"Prinsip tepat waktu: mulai tepat usia 6 bulan dan kenali tanda bayi siap makan.", isi:`
  <p class="inti">MP-ASI mulai diberikan tepat saat bayi berusia 6 bulan. ASI tetap dilanjutkan sampai anak berusia 2 tahun atau lebih.</p>
  <div class="side"><p>Mulai usia 6 bulan, ASI saja tidak lagi cukup memenuhi kebutuhan energi dan zat gizi bayi. Teruskan menyusui semau bayi sambil memberi MP-ASI.</p>${foto("asi","ASI tetap diberikan sampai anak 2 tahun atau lebih")}</div>
  <h3>Tanda bayi sudah siap makan</h3>
  <ul><li>Kepala sudah tegak dan bayi dapat duduk dengan bantuan.</li><li>Refleks menjulurkan lidah sudah berkurang.</li><li>Refleks muntah sudah melemah.</li><li>Bayi tertarik pada makanan selain ASI.</li></ul>
  <p><a href="#materi-10">Cara melatih kemampuan ini sejak usia 3 bulan →</a></p>
  <h3>Jangan terlalu cepat, jangan terlambat</h3>
  <div class="dua"><div class="box tidak"><h3>Sebelum 6 bulan</h3><p>Bayi lebih mudah terkena infeksi, asupan gizi rendah, dan sulit mencerna makanan.</p></div>
  <div class="box tidak"><h3>Setelah 6 bulan</h3><p>Kebutuhan gizi tidak terpenuhi, risiko alergi makanan meningkat, dan kemampuan mengunyah kurang terlatih.</p></div></div>
  <h3>Mengapa tidak sebelum 6 bulan?</h3>
  <p>Sampai usia 6 bulan, ASI saja sudah mencukupi kebutuhan gizi bayi, dan saluran pencernaannya belum siap menerima makanan selain ASI. MP-ASI yang terlalu dini justru meningkatkan risiko gangguan pencernaan dan infeksi, seperti diare.</p>
  <h3>Setelah 6 bulan, ASI tetap diberikan</h3>
  <p>ASI tidak diganti susu formula dan tidak dihentikan. ASI tetap diberikan bersama MP-ASI, semau bayi, sampai anak berusia 2 tahun atau lebih.</p>
  <p>MP-ASI tidak perlu menunggu gigi tumbuh. MP-ASI pertama dibuat lembik sehingga mudah dilumatkan dengan air liur dan gusi bayi.</p>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li>MP-ASI dimulai tepat usia <b>6 bulan</b>.</li><li>Sebelum 6 bulan, <b>ASI saja sudah mencukupi</b> kebutuhan gizi bayi.</li><li>MP-ASI terlalu dini meningkatkan risiko <b>gangguan pencernaan dan infeksi</b>.</li><li>Setelah 6 bulan, <b>ASI tetap diberikan bersama MP-ASI</b>.</li></ul></div>`},
 {id:3, judul:"Zat Gizi MP-ASI", ringkas:"Prinsip adekuat: cukup energi, protein, dan zat gizi mikro sesuai umur.", isi:`
  <p class="inti">Setiap kali makan, MP-ASI harus cukup energi, protein, lemak, vitamin, dan mineral. MP-ASI melengkapi ASI, bukan menggantikannya.</p>
  <p><strong>Piring makan anak berisi lima kelompok pangan:</strong></p>
  <div class="pangan">${[["karbo","Karbohidrat"],["hewani","Protein hewani"],["nabati","Protein nabati"],["sayur","Sayuran"],["buah","Buah"]].map(([k,t])=>`<figure><img src="${IMG[k].src}" width="${IMG[k].w}" height="${IMG[k].h}" alt="${t}" loading="lazy"><figcaption>${t}</figcaption></figure>`).join("")}</div>
  <p class="catatan">Foto: Pedoman PMBA, Kemenkes RI 2020.</p>
  <h3>Berapa energi yang perlu dari MP-ASI?</h3>
  <p>Lambung bayi masih kecil, sekitar 25–30 ml per kg berat badan. Karena itu MP-ASI harus padat gizi, bukan encer. Makin besar anak, makin sedikit bagian kebutuhan yang dipenuhi ASI.</p>
  <div class="tbl"><table><thead><tr><th>Umur</th><th>Kebutuhan energi sehari</th><th>Dipenuhi ASI</th><th>Perlu dari MP-ASI</th></tr></thead><tbody>
  <tr><td>6–8 bulan</td><td>800 kkal</td><td>60–70%</td><td>± 200 kkal</td></tr>
  <tr><td>9–11 bulan</td><td>800 kkal</td><td>50–70%</td><td>± 300 kkal</td></tr>
  <tr><td>12–24 bulan</td><td>1.350 kkal</td><td>30–40%</td><td>± 550 kkal</td></tr></tbody></table></div>
  <div class="tbl"><table><thead><tr><th>Kelompok pangan</th><th>Contoh bahan lokal</th><th>Gunanya</th></tr></thead><tbody>
  <tr><td>Karbohidrat</td><td>Nasi, kentang, ubi, sagu, jagung, singkong</td><td>Sumber tenaga</td></tr>
  <tr><td>Protein hewani</td><td>Telur, ikan, ayam, daging, hati ayam</td><td>Pertumbuhan dan zat besi</td></tr>
  <tr><td>Protein nabati</td><td>Tahu, tempe, kacang-kacangan</td><td>Pertumbuhan</td></tr>
  <tr><td>Sayuran</td><td>Wortel, bayam, labu kuning, kangkung, daun kelor</td><td>Vitamin dan mineral</td></tr>
  <tr><td>Buah</td><td>Pisang, pepaya, jeruk</td><td>Vitamin dan mineral</td></tr></tbody></table></div>
  <p><strong>Tambahkan sedikit lemak</strong> seperti minyak, santan, atau margarin saat memasak. Lemak <b>menambah energi</b> tanpa membuat porsi makin besar, dan <b>membantu tubuh menyerap vitamin</b> A, D, E, dan K dari makanan.</p>
  <p><strong>Batasi gula dan garam.</strong> Makanan keluarga yang sudah berbumbu boleh dipakai tanpa menambah gula dan garam lagi. Garam untuk bayi 0–12 bulan kurang dari 1 gram per hari.</p>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li>MP-ASI harus mengandung <b>karbohidrat, protein, dan lemak</b>, ditambah vitamin dan mineral, sejak pertama kali diberikan.</li><li>Bukan karbohidrat saja, dan bukan protein atau lemak saja.</li><li>Lemak berfungsi <b>menambah energi dan membantu penyerapan vitamin</b>.</li></ul></div>`},
 {id:4, judul:"Tekstur dan Frekuensi Makan", ringkas:"Tekstur, jumlah, dan frekuensi makan naik bertahap sesuai umur, termasuk kapan MP-ASI boleh diblender.", isi:`
  <p class="inti">Tekstur, porsi, dan frekuensi makan naik bertahap sesuai umur. Baca semua kelompok umur agar Ibu tahu apa yang berubah ketika anak bertambah besar.</p>
  ${foto("tekstur","Dari kiri: lumat (6–8 bulan), lembik (9–11 bulan), dan makanan keluarga (12–24 bulan). Foto: Pedoman PMBA, Kemenkes RI 2020.")}
  <div class="tbl"><table><thead><tr><th></th><th>6–8 bulan</th><th>9–11 bulan</th><th>12–24 bulan</th></tr></thead><tbody>
  <tr><th>Tekstur</th><td>Lumat: dihaluskan lalu <b>disaring</b>, bubur kental</td><td>Lembik: <b>dicincang halus atau lembek</b></td><td><b>Makanan keluarga</b> dipotong kecil</td></tr>
  <tr><th>Porsi sekali makan</th><td>2–3 sdm → ½ mangkuk (125 ml)</td><td>½ → ¾ mangkuk (200 ml)</td><td>¾ → 1 mangkuk (250 ml)</td></tr>
  <tr><th>Makanan utama</th><td>2–3 kali sehari</td><td>3–4 kali sehari</td><td>3–4 kali sehari</td></tr>
  <tr><th>Selingan</th><td>1–2 kali sehari</td><td>1–2 kali sehari</td><td>1–2 kali sehari</td></tr>
  <tr><th>ASI</th><td>Semau bayi</td><td>Semau bayi</td><td>Sebagai minuman</td></tr></tbody></table></div>
  <p class="catatan">Mangkuk yang dimaksud adalah mangkuk ukuran 250 ml.</p>
  <p><strong>Mulai usia 8 bulan, latih anak makan sendiri</strong> dengan makanan yang bisa dipegang. Naikkan tekstur sedikit demi sedikit sesuai kemampuan anak mengunyah dan menelan.</p>
  <p>Untuk bayi 6–8 bulan, makanan yang sudah dihaluskan sebaiknya <b>disaring</b> agar benar-benar lumat tanpa butiran kasar. Makanan cincang kasar dan makanan keluarga utuh belum cocok untuk umur ini.</p>
  <h3>Bolehkah MP-ASI diblender?</h3>
  <p><b>Boleh, untuk awal MP-ASI usia 6–8 bulan.</b> Blender membantu menghaluskan makanan keluarga. Setelah diblender, <b>saring</b> bubur agar benar-benar lumat dan tidak ada ampas atau butiran kasar. Jangan menambah banyak air saat memblender, supaya bubur tetap <b>kental</b> dan padat gizi.</p>
  <div class="tbl"><table><thead><tr><th>Umur</th><th>Pakai blender?</th><th>Cara menyiapkan</th></tr></thead><tbody>
  <tr><td>6–8 bulan</td><td>Boleh</td><td>Blender atau ulek halus, lalu <b>disaring</b>. Tekstur dinaikkan pelan-pelan menjelang 9 bulan.</td></tr>
  <tr><td>9–11 bulan</td><td>Tidak perlu</td><td><b>Dicincang halus atau dibuat lembek</b>, bukan diblender, agar anak belajar mengunyah.</td></tr>
  <tr><td>12–24 bulan</td><td>Tidak perlu</td><td><b>Makanan keluarga</b> dipotong kecil sesuai kemampuan anak.</td></tr></tbody></table></div>
  <div class="dua"><div class="box tidak"><h3>Jangan terus-menerus diblender</h3><p>Anak yang terlalu lama diberi makanan blender kehilangan kesempatan melatih otot mulut dan lidah untuk mengunyah dan menelan. Anak juga berisiko mengemut makanan atau menolak makanan bertekstur di kemudian hari.</p></div>
  <div class="box ya"><h3>Blender yang bersih</h3><ul><li>Cuci tangan sebelum memakai blender.</li><li>Bongkar dan cuci gelas, pisau, dan karet blender dengan air bersih dan sabun setiap selesai dipakai.</li><li>Keringkan sebelum disimpan.</li><li>Blender makanan yang sudah matang, lalu langsung diberikan.</li></ul></div></div>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li>6–8 bulan: <b>2–3 kali makan utama + 1–2 kali selingan</b>, tekstur <b>lumat yang disaring</b>.</li><li>9–11 bulan: <b>3–4 kali makan utama + selingan</b>, jumlah <b>½ sampai ¾ mangkuk</b>, tekstur <b>cincang halus atau lembek</b>.</li><li>Blender hanya untuk 6–8 bulan dan <b>tetap disaring</b>; mulai 9 bulan makanan <b>dicincang, bukan diblender</b>.</li><li>12–24 bulan: <b>3–4 kali makan utama + selingan</b>, tekstur <b>makanan keluarga</b>.</li><li>Jumlah makan tidak dibiarkan sesuka anak, tetapi mengikuti anjuran umurnya sambil memperhatikan tanda lapar dan kenyang.</li></ul></div>
  <p><a class="btn btn-labu" href="#porsi">Lihat porsi untuk umur anak saya</a></p>`},
 {id:5, judul:"Keragaman Makanan", ringkas:"Lima kelompok pangan, protein hewani di setiap makan, dan memanfaatkan pangan lokal.", isi:`
  <p class="inti">Usahakan setiap kali makan berisi beberapa kelompok pangan, dan selalu ada protein hewani.</p>
  <h3>Mengapa protein hewani diutamakan?</h3>
  <ul><li><b>Membantu pertumbuhan dan perkembangan anak.</b></li><li>Mengandung asam amino yang lengkap.</li><li>Mineralnya, terutama zat besi, mudah diserap tubuh.</li><li>Boleh diberikan sejak hari pertama MP-ASI, tidak perlu ditunda.</li></ul>
  <div class="dua"><div class="box ya"><h3>Contoh protein hewani</h3><p>Telur, ikan, ayam, daging, hati ayam, udang.</p></div><div class="box tidak"><h3>Bukan protein hewani</h3><p>Tahu dan tempe termasuk protein <b>nabati</b>. Bayam termasuk <b>sayuran</b>.</p></div></div>
  <h3>Mengapa makanan harus bervariasi?</h3>
  <p>Tidak ada satu bahan makanan yang mengandung semua zat gizi. MP-ASI yang tidak bervariasi membuat anak <b>berisiko kekurangan zat gizi tertentu</b>. Karena itu, gunakan bahan dari beberapa kelompok pangan setiap hari, bukan satu jenis bahan saja, dan hindari makanan instan sebagai menu utama.</p>
  <h3>Cara mudah membuat menu beragam</h3>
  <ul><li>Ganti lauk hewani setiap hari, misalnya telur, ikan, ayam, dan hati ayam bergantian.</li><li>Pakai ikan yang mudah didapat di sekitar rumah, baik ikan laut maupun ikan air tawar.</li><li>Kenalkan berbagai rasa dan tekstur sejak usia 6–8 bulan agar anak tidak pilih-pilih makanan.</li><li>Jangan terlalu banyak sayur berserat tinggi, karena dapat membuat bayi sulit buang air besar.</li></ul>
  <h3>Manfaatkan pangan lokal</h3>
  <p><b>Pangan lokal adalah bahan makanan yang banyak tersedia di sekitar kita.</b> Bahan ini lebih segar, mudah didapat, dan harganya terjangkau. Kementerian Kesehatan menganjurkan MP-ASI dibuat dari pangan lokal, diambil dari menu makanan keluarga lalu disesuaikan teksturnya.</p>
  <div class="tbl"><table><thead><tr><th>Kelompok pangan</th><th>Contoh pangan lokal di sekitar Kolaka</th></tr></thead><tbody>
  <tr><td>Karbohidrat</td><td>Nasi, sagu (sinonggi), jagung, ubi kayu, ubi jalar, pisang kepok</td></tr>
  <tr><td>Protein hewani</td><td>Ikan laut seperti kembung, tongkol, cakalang, dan teri; ikan air tawar; telur ayam dan telur puyuh; ayam; hati ayam; udang</td></tr>
  <tr><td>Protein nabati</td><td>Tahu, tempe, kacang hijau, kacang merah</td></tr>
  <tr><td>Sayuran</td><td>Daun kelor, kangkung, bayam, daun ubi, labu kuning, wortel, tomat</td></tr>
  <tr><td>Buah</td><td>Pisang, pepaya, jeruk, mangga</td></tr></tbody></table></div>
  <div class="dua"><div class="box ya"><h3>Tips memakai pangan lokal</h3><ul><li>Desa pesisir kaya ikan laut. Ikan adalah lauk hewani yang murah dan kaya protein.</li><li>Sagu atau ubi boleh menjadi sumber karbohidrat, asal selalu ditemani lauk hewani dan sayur karena kandungan proteinnya rendah.</li><li>Daun kelor mudah ditanam di pekarangan dan bisa dicampur ke bubur atau sayur bening.</li><li>Pilih bahan yang masih segar dan sesuai musim.</li></ul></div>
  <div class="box tidak"><h3>Lebih baik dari makanan instan</h3><p>MP-ASI buatan sendiri dari pangan lokal lebih dianjurkan daripada makanan instan. Pilih bahan yang alami dan tidak banyak diolah pabrik.</p></div></div>
  <p><a href="#resep">Lihat contoh resep MP-ASI pangan lokal →</a></p>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li>Protein hewani penting untuk <b>pertumbuhan dan perkembangan anak</b>.</li><li>Gunakan <b>pangan lokal</b> seperti ikan laut, sagu, ubi, dan daun kelor yang segar dan terjangkau.</li><li><b>Telur</b> adalah contoh protein hewani; tahu dan tempe adalah protein nabati.</li><li>MP-ASI yang tidak bervariasi membuat anak <b>berisiko kekurangan zat gizi tertentu</b>.</li><li>Gunakan <b>bahan yang bervariasi dari beberapa kelompok pangan</b>.</li></ul></div>`},
 {id:6, judul:"Keamanan Pangan", ringkas:"Prinsip aman dan bersih: lima kunci keamanan pangan dan cuci tangan.", isi:`
  <p class="inti">Bayi mudah terkena infeksi. MP-ASI harus disiapkan, dimasak, dan disimpan dengan bersih agar anak tidak diare.</p>
  <h3>Lima kunci makanan aman</h3>
  <div class="kunci">${["Jaga kebersihan","Pisahkan mentah dan matang","Masak sampai matang","Simpan pada suhu aman","Air dan bahan yang aman"].map((t,i)=>`<figure><img src="${IMG["k"+(i+1)].src}" width="${IMG["k"+(i+1)].w}" height="${IMG["k"+(i+1)].h}" alt="${t}" loading="lazy"><figcaption>${i+1}. ${t}</figcaption></figure>`).join("")}</div>
  <ol><li><strong>Jaga kebersihan</strong> tangan, bahan makanan, tempat, dan alat masak.</li><li><strong>Pisahkan</strong> pisau dan talenan untuk bahan mentah dan makanan matang, agar <b>tidak terjadi pencemaran silang</b> (kuman dari bahan mentah pindah ke makanan matang).</li><li><strong>Masak sampai matang</strong>, terutama daging, ayam, telur, dan ikan.</li><li><strong>Simpan pada suhu aman</strong>: di atas 60°C untuk makanan panas atau di bawah 5°C di kulkas.</li><li><strong>Pakai air dan bahan yang aman</strong>: air bersih dan bahan yang segar.</li></ol>
  <p class="catatan">Gambar: Buku Saku PMBA, Kemenkes RI 2021.</p>
  <h3>Cuci tangan pakai sabun (± 20 detik)</h3>
  <ol><li>Basahi seluruh tangan dengan air mengalir.</li><li>Gosok sabun ke telapak, punggung tangan, dan sela jari.</li><li>Bersihkan bagian bawah kuku.</li><li>Bilas dengan air bersih yang mengalir.</li><li>Keringkan dengan handuk bersih, tisu, atau diangin-anginkan.</li></ol>
  <p>Cuci tangan terutama sebelum menyiapkan makanan, sebelum menyuapi anak, dan setelah buang air besar atau membersihkan kotoran anak.</p>
  <h3>Peralatan makan anak</h3>
  <ul><li>Cuci piring, sendok, dan gelas anak dengan <b>air bersih dan sabun</b> setiap kali selesai dipakai, bukan dibilas air saja.</li><li>Gunakan peralatan makan khusus untuk anak; jangan dipakai bergantian dengan anggota keluarga lain.</li></ul>
  <h3>Makanan yang sudah dimasak</h3>
  <ul><li>Sebaiknya <b>langsung dihabiskan</b>.</li><li>Bila tersisa, <b>simpan dengan cara yang benar</b>: dalam wadah tertutup, di dalam kulkas, dan panaskan sampai matang sebelum diberikan lagi.</li><li>Jangan dibiarkan terbuka dan jangan dicampur dengan makanan lama.</li></ul>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li>Sebelum menyiapkan makanan, <b>cuci tangan dengan sabun dan air mengalir</b>.</li><li>Peralatan makan anak <b>dicuci dengan air bersih dan sabun</b>.</li><li>Makanan matang <b>dihabiskan atau disimpan dengan cara yang benar</b>.</li><li>Bahan mentah dan matang dipisahkan untuk <b>mencegah pencemaran silang</b>.</li><li>Gunakan <b>air bersih dan bahan makanan segar</b>.</li></ul></div>`},
 {id:7, judul:"Pemberian Makan Responsif", ringkas:"Prinsip diberikan dengan cara yang benar: kenali tanda lapar dan kenyang.", isi:`
  <p class="inti">Beri makan sambil memperhatikan tanda lapar dan kenyang anak, tanpa memaksa.</p>
  ${foto("responsif","Duduk bersama anak dan beri semangat saat makan. Gambar: Buku Saku PMBA, Kemenkes RI 2021.")}
  <div class="dua"><div class="box ya wajah">${ILUS.wajah.lapar}<h3>Tanda anak lapar</h3><ul><li>Mengecap atau menghisap bibir</li><li>Membuka mulut saat melihat sendok</li><li>Memasukkan tangan ke mulut atau menangis</li><li>Mencondongkan badan ke arah makanan</li></ul></div>
  <div class="box tidak wajah">${ILUS.wajah.kenyang}<h3>Tanda anak kenyang</h3><ul><li>Memalingkan muka</li><li>Menutup mulut dengan tangan</li><li>Rewel, menangis, atau tertidur</li></ul></div></div>
  ${foto("jadwal","Lama makan sekitar 30 menit dan biasakan makan bersama keluarga. Gambar: Buku Saku PMBA, Kemenkes RI 2021.")}
  <h3>Lakukan</h3>
  <ul><li><b>Segera beri makan ketika anak menunjukkan tanda lapar</b>; jangan ditunda atau didahului jajanan.</li><li>Buat jadwal makan dan selingan yang teratur; lama makan sekitar 30 menit.</li><li>Beri anak piringnya sendiri agar Ibu tahu berapa banyak yang dimakan.</li><li>Duduk bersama anak, sabar, dan beri semangat. Ajak makan bersama keluarga.</li><li>Biarkan anak belajar makan sendiri dengan makanan yang bisa dipegang.</li></ul>
  <h3>Hindari</h3>
  <ul><li>Memaksa atau mengancam anak, meskipun baru makan 1–2 suap.</li><li>Memberi makanan manis sebelum waktu makan, karena mengurangi nafsu makan.</li><li>Makan sambil menonton TV atau bermain HP.</li><li>Memberi makanan sebagai hadiah.</li><li>Memberi minum terlalu banyak sebelum dan saat makan.</li></ul>
  <h3>Jika anak menolak makan</h3>
  <p>Tetap sabar dan jangan memaksa atau memarahi anak. Jangan pula membujuk dengan jajanan manis. Tawarkan makanan kembali dengan cara yang menyenangkan. Jika setelah 15 menit anak tetap menolak atau mengemut, hentikan dan coba lagi pada waktu makan berikutnya.</p>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li>Pemberian makan responsif artinya <b>memperhatikan tanda lapar dan kenyang anak</b>.</li><li>Saat anak lapar, <b>segera beri makan</b>.</li><li>Saat anak menolak, <b>tetap sabar, tidak memaksa, dan tawarkan kembali dengan cara yang positif</b>.</li><li>Hindari <b>menonton TV atau bermain gawai</b> saat makan.</li></ul></div>`},
 {id:8, judul:"Permasalahan dalam PMBA", ringkas:"Anak tutup mulut (GTM), makan saat anak sakit, dan mitos seputar MP-ASI.", isi:`
  ${foto("masalah","Bujuk anak dengan sabar saat susah makan. Gambar: Buku Saku PMBA, Kemenkes RI 2021.")}
  <h3>Anak tutup mulut (GTM)</h3>
  <p>GTM biasanya terjadi karena anak bosan dengan makanannya, sedang sakit, atau masih kenyang.</p>
  <ul><li><b>Buat menu yang bervariasi</b> dan tampilan yang menarik. Jangan memaksa anak dan jangan memberi jajanan sebelum makan.</li><li>Kenali jam lapar anak; jangan beri minum terlalu banyak sebelum makan.</li><li>Jika anak mengemut, beri tekstur lebih lembik dan latih mengunyah dengan makan bersama.</li><li>Jika anak sakit, misalnya sariawan atau sakit tenggorokan, periksakan ke puskesmas.</li></ul>
  <h3>Makan saat anak sakit</h3>
  <ul><li>Pemberian makan <b>tidak dihentikan</b>. Beri makanan beragam dan padat energi <b>dalam porsi kecil tetapi lebih sering</b>.</li><li>Beri makanan kesukaan anak dan bujuk dengan sabar.</li><li>Teruskan pemberian ASI.</li><li>Setelah sembuh, beri makan lebih banyak dan lebih sering dari biasanya, serta ASI lebih sering.</li></ul>
  <h3>Jajanan manis sebelum makan</h3>
  <p>Jajanan manis sebelum waktu makan membuat anak kenyang lebih dulu, sehingga <b>anak menjadi sulit makan makanan utama</b>. Berikan selingan yang bergizi pada jam selingan, bukan menjelang makan utama.</p>
  <h3>Mitos dan fakta</h3>
  <div class="mitos">
   <div class="mf"><div class="m"><span class="lbl">Mitos</span><p>Makan daging atau ikan menyebabkan cacingan.</p></div><div class="f"><span class="lbl">Fakta</span><p>Daging dan ikan kaya zat besi. Cacingan disebabkan lingkungan bermain yang kurang bersih.</p></div></div>
   <div class="mf"><div class="m"><span class="lbl">Mitos</span><p>Protein hewani harus ditunda karena takut alergi.</p></div><div class="f"><span class="lbl">Fakta</span><p>Protein hewani boleh diberikan sejak awal MP-ASI karena zat besinya dibutuhkan bayi.</p></div></div>
   <div class="mf"><div class="m"><span class="lbl">Mitos</span><p>MP-ASI pertama harus encer agar tidak tersedak.</p></div><div class="f"><span class="lbl">Fakta</span><p>Bubur encer terlalu banyak air sehingga gizinya kurang. Air liur bayi membantu melumatkan makanan lembik.</p></div></div>
   <div class="mf"><div class="m"><span class="lbl">Mitos</span><p>MP-ASI diberikan setelah gigi tumbuh.</p></div><div class="f"><span class="lbl">Fakta</span><p>MP-ASI dimulai usia 6 bulan dengan tekstur lembik, tanpa menunggu gigi.</p></div></div>
   <div class="mf"><div class="m"><span class="lbl">Mitos</span><p>Makanan rendah lemak dan tinggi serat baik untuk bayi.</p></div><div class="f"><span class="lbl">Fakta</span><p>Bayi butuh lemak untuk energi. Serat yang berlebihan dapat menyebabkan sembelit.</p></div></div>
  </div>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li>Anak sulit makan: <b>berikan menu yang bervariasi</b>.</li><li>Anak sakit: makan <b>tetap diberikan dalam porsi kecil tetapi lebih sering</b>, dan ASI diteruskan.</li><li>Jajanan manis sebelum makan membuat <b>anak sulit makan makanan utama</b>.</li></ul></div>`},
 {id:9, judul:"Susu Formula dan Susu Lain", ringkas:"Kapan susu formula boleh diberikan, susu apa yang dianjurkan untuk anak yang tidak mendapat ASI, dan cara memberikannya dengan aman.", isi:`
  <p class="inti">ASI adalah susu terbaik untuk bayi dan anak sampai usia 2 tahun atau lebih. Susu formula bukan pengganti ASI bagi bayi yang masih bisa menyusu, dan hanya diberikan bila ada indikasi medis atas saran tenaga kesehatan.</p>
  <h3>Kapan susu formula boleh diberikan?</h3>
  <p>Menurut Pedoman PMBA Kemenkes, susu formula diberikan hanya untuk bayi dan anak yang:</p>
  <ul><li>benar-benar membutuhkan menurut pertimbangan tenaga kesehatan (indikasi medis);</li><li>terpisah dari ibunya dan tidak mendapat donor ASI;</li><li>ibunya meninggal, sakit keras, atau tidak dapat menyusui karena alasan kesehatan tertentu.</li></ul>
  <p>Konsultasikan dulu dengan bidan, dokter, atau ahli gizi di puskesmas sebelum memberi susu formula.</p>
  <h3>Ibu bekerja tetap bisa memberi ASI</h3>
  <ul><li>Perah ASI sebelum berangkat kerja dan titipkan kepada pengasuh.</li><li>Ajarkan pengasuh memberikan ASI perah dengan <b>cangkir, bukan botol</b>.</li><li>Utamakan bayi menyusu langsung saat Ibu di rumah.</li></ul>
  <h3>Anak 6–23 bulan yang tidak mendapat ASI</h3>
  <p>Prinsip makannya sama dengan anak yang mendapat ASI, ditambah:</p>
  <ul><li><b>1–2 kali makan ekstra</b> setiap hari, selain makan utama sesuai umurnya.</li><li>Makanan selingan 1–2 kali sehari.</li><li><b>1–2 gelas (@250 ml) susu</b> segar atau susu formula per hari, serta 2–3 kali cairan lain seperti air putih atau kuah sayur, terutama saat cuaca panas.</li></ul>
  <div class="tbl"><table><thead><tr><th>Umur</th><th>Susu yang dianjurkan WHO bila tidak mendapat ASI</th></tr></thead><tbody>
  <tr><td>6–11 bulan</td><td>Susu formula bayi <b>atau</b> susu hewani (misalnya susu sapi) <b>full cream</b>, bukan rendah lemak.</td></tr>
  <tr><td>12–23 bulan</td><td><b>Susu hewani</b> seperti susu sapi segar yang sudah dipasteurisasi, susu evaporasi yang diencerkan, atau yoghurt. <b>Susu formula lanjutan tidak direkomendasikan.</b></td></tr></tbody></table></div>
  <div class="dua"><div class="box tidak"><h3>Hindari</h3><ul><li>Susu kental manis.</li><li>Susu berperisa atau yang diberi gula.</li><li>Minuman manis dan jus kemasan.</li><li>Susu pertumbuhan (<i>growing-up milk</i>): tidak diperlukan dan sering tinggi gula.</li></ul></div>
  <div class="box ya"><h3>Jika memberi susu formula</h3><ul><li>Cuci tangan dan peralatan sampai bersih.</li><li><b>Didihkan air</b> yang dipakai, termasuk air minum dalam kemasan.</li><li>Ikuti takaran pada kemasan dan petunjuk tenaga kesehatan.</li><li>Periksa tanggal kedaluwarsa.</li><li>Berikan dengan <b>cangkir</b>, bukan botol dan dot.</li></ul></div></div>
  <p>Susu tidak menggantikan makanan. Anak tetap perlu MP-ASI yang beragam dengan protein hewani setiap kali makan.</p>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li><b>ASI tetap yang terbaik</b> sampai anak 2 tahun atau lebih.</li><li>Susu formula hanya bila ada <b>indikasi medis</b> dan atas saran tenaga kesehatan.</li><li>Anak 12–23 bulan yang tidak mendapat ASI cukup diberi <b>susu hewani</b>; susu formula lanjutan dan susu pertumbuhan tidak diperlukan.</li><li>Hindari susu kental manis dan susu bergula.</li></ul></div>
  <p class="catatan">Sumber: Pedoman PMBA (Kemenkes RI, 2020), Buku Saku PMBA (Kemenkes RI, 2021), WHO Guideline for Complementary Feeding (2023), dan UNICEF Programming Guidance (2020).</p>`},
 {id:10, judul:"Melatih Motorik Anak untuk Persiapan MP-ASI", ringkas:"Latihan duduk, meraih, memegang, dan melatih mulut agar bayi siap makan dan pandai makan sendiri.", isi:`
  <p class="inti">Bayi siap makan bila tubuh, tangan, dan mulutnya sudah terlatih: kepala tegak, bisa duduk dengan bantuan, bisa meraih benda ke mulut, dan refleks menjulurkan lidah sudah berkurang. Kemampuan ini bisa dilatih sejak usia 3 bulan lewat bermain sehari-hari.</p>
  <h3>Latihan sesuai umur</h3>
  <div class="view" style="gap:10px"><div class="box ya"><h3>3–6 bulan (sebelum MP-ASI)</h3><p><b>Ajak bermain:</b> Tengkurap dan berguling-guling, latih duduk dengan bantuan, ajak melihat dan meraih benda, mengambil benda kecil yang aman. Peluk, tatap mata, dan ajak bicara.</p><p><b>Yang diharapkan:</b> Kepala tegak, bisa berbalik dari telungkup ke telentang, meraih benda ke arah mulut.</p></div><div class="box ya"><h3>6–9 bulan</h3><p><b>Ajak bermain:</b> Latih duduk, pegang mainan dengan 2 tangan, memasukkan benda kecil ke wadah, sembunyikan dan cari mainan. Ajari makan sendiri dengan sendok dan minum dengan gelas.</p><p><b>Yang diharapkan:</b> Duduk sendiri, memindahkan benda dari satu tangan ke tangan lain, memasukkan benda ke mulut.</p></div><div class="box ya"><h3>9–12 bulan</h3><p><b>Ajak bermain:</b> Latih memegang benda kecil dengan 2 jari, merangkak, berdiri berpegangan. Beri makanan yang bisa dipegang sendiri.</p><p><b>Yang diharapkan:</b> Memungut benda kecil, makan makanan yang dipegang sendiri, mulai makan bersama keluarga.</p></div></div>
  <p class="catatan">Sumber: Buku KIA (Kemenkes RI, 2024), halaman stimulasi bayi 3–6, 6–9, dan 9–12 bulan.</p>
  <h3>Melatih mulut dan lidah</h3>
  <ul><li>Biarkan bayi mengeksplorasi mainan yang bersih dan aman dengan bibir, lidah, dan gusinya. Cara ini membantu mengurangi rasa ingin muntah saat mulai makan.</li><li>Beri mainan gigit dengan tekstur yang sesuai perkembangan bayi.</li><li>Naikkan tekstur makanan sedikit demi sedikit: lumat, lalu lembik, lalu makanan keluarga.</li><li>Ajak bayi makan bersama keluarga agar ia meniru gerakan mengunyah.</li></ul>
  <h3>Melatih makan sendiri</h3>
  <ul><li>Mulai usia 8 bulan, beri selingan yang bisa dipegang sendiri, misalnya potongan buah lunak atau perkedel.</li><li>Biarkan anak memegang sendok dan gelas sendiri, walau masih berantakan.</li><li>Pastikan makanan benar-benar masuk ke mulut, dan jangan beri makanan yang mudah membuat tersedak.</li></ul>
  <div class="dua"><div class="box ya"><h3>Saat latihan dan makan</h3><ul><li>Dudukkan bayi tegak dan nyaman, jangan sambil tiduran.</li><li>Selalu awasi bayi.</li><li>Cuci tangan bayi dan mainannya sebelum dimasukkan ke mulut.</li></ul></div>
  <div class="box tidak"><h3>Segera ke puskesmas bila</h3><p>Bayi belum bisa melakukan penanda perkembangan sesuai umurnya, misalnya usia 6–9 bulan belum bisa duduk sendiri. Lihat daftar penanda perkembangan di Buku KIA Ibu.</p></div></div>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li>Latih bayi <b>tengkurap, berguling, duduk, dan meraih</b> sejak usia 3 bulan.</li><li>Biarkan bayi <b>mengeksplorasi mainan bersih dengan mulutnya</b> untuk melatih lidah dan gusi.</li><li>Mulai 8 bulan, <b>latih makan sendiri</b> dengan makanan yang bisa dipegang.</li><li>Pantau perkembangan anak di <b>Buku KIA</b>.</li></ul></div>
  <p class="catatan">Sumber: Buku KIA (Kemenkes RI, 2024), Pedoman PMBA (Kemenkes RI, 2020), dan Buku Saku PMBA (Kemenkes RI, 2021).</p>`},
 {id:11, judul:"Hal Penting Lainnya untuk Ibu", ringkas:"Timbang setiap bulan, vitamin A, batasi makanan dan minuman tidak sehat, gawai, dan kapan ke puskesmas.", isi:`
  <p class="inti">Selain MP-ASI yang tepat, tumbuh kembang anak juga dijaga dengan pemantauan rutin di posyandu, menghindari makanan dan minuman tidak sehat, serta pengasuhan yang penuh kasih sayang.</p>
  <h3>1. Bawa anak ke posyandu setiap bulan</h3>
  <ul><li>Anak <b>ditimbang dan diukur setiap bulan</b> untuk mendeteksi gangguan pertumbuhan sejak dini.</li><li>Lihat garis pertumbuhan di <b>Buku KIA</b>. Bila berat badan tidak naik, segera konsultasikan dengan tenaga kesehatan.</li><li>Di posyandu anak juga mendapat <b>imunisasi, vitamin A, dan obat cacing</b> sesuai jadwal.</li></ul>
  <h3>2. Kapsul vitamin A, setiap Februari dan Agustus</h3>
  <div class="dua"><div class="box ya"><h3>Kapsul biru</h3><p>Untuk bayi usia <b>6–11 bulan</b> (100.000 SI).</p></div><div class="box tidak"><h3>Kapsul merah</h3><p>Untuk anak usia <b>12 bulan ke atas</b> (200.000 SI).</p></div></div>
  <p class="catatan">Kapsul diberikan oleh petugas di posyandu atau puskesmas.</p>
  <h3>3. Isi piring yang dianjurkan WHO</h3>
  <ul><li><b>Setiap hari:</b> makanan hewani seperti daging, ikan, atau telur.</li><li><b>Setiap hari:</b> buah dan sayur.</li><li><b>Sering:</b> kacang-kacangan dan biji-bijian, dalam bentuk yang aman agar tidak tersedak, misalnya dihaluskan.</li><li>Jangan hanya nasi atau bubur saja. Makanan pokok tetap perlu, tetapi lauk hewani, sayur, dan buah yang membuat gizi anak lengkap.</li></ul>
  <h3>4. Batasi makanan dan minuman tidak sehat</h3>
  <div class="box tidak"><ul><li>Makanan tinggi gula, garam, dan lemak trans, seperti permen, kue manis, dan keripik.</li><li>Minuman manis dan minuman kemasan, termasuk yang memakai pemanis buatan.</li><li>Jus buah kemasan; jus buah 100% pun dibatasi.</li><li>Makanan instan yang banyak mengandung MSG dan pengawet.</li></ul></div>
  <p>Makanan dan minuman ini hanya menambah energi, sedikit zat gizinya, dan membuat anak tidak lapar saat waktu makan.</p>
  <h3>5. Anak di bawah 18 bulan tanpa gawai</h3>
  <p>Anak di bawah 18 bulan tidak menggunakan gawai, kecuali panggilan video yang didampingi orang tua. Gawai berlebihan dapat menyebabkan keterlambatan bicara, kurang interaksi, mudah marah, dan gangguan kemampuan berpikir. Ganti dengan bermain, bercerita, dan bernyanyi bersama.</p>
  <h3>6. Pengasuhan penuh kasih sayang</h3>
  <ul><li>Tanggapi tangisan bayi; jangan biarkan bayi menangis lama.</li><li>Ajak bicara, tatap mata, dan peluk anak setiap hari.</li><li>Bayi usia 4–12 bulan perlu tidur 12–16 jam sehari, termasuk tidur siang.</li></ul>
  <h3>7. Segera ke puskesmas bila</h3>
  <div class="box tidak"><p>Anak demam tinggi, diare terus-menerus, muntah terus, tidak mau minum atau menyusu, tampak lemas, sesak napas, atau berat badannya tidak naik. Jangan menunggu jadwal posyandu.</p></div>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li><b>Timbang anak setiap bulan</b> dan lihat grafiknya di Buku KIA.</li><li>Ambil <b>kapsul vitamin A</b> setiap Februari dan Agustus.</li><li><b>Makanan hewani, sayur, dan buah setiap hari.</b></li><li><b>Hindari</b> minuman manis, jajanan tinggi gula dan garam, serta makanan instan.</li><li>Anak di bawah 18 bulan <b>tanpa gawai</b>.</li></ul></div>
  <p class="catatan">Sumber: Pedoman PMBA (Kemenkes RI, 2020), Buku KIA (Kemenkes RI, 2024), WHO Guideline for Complementary Feeding (2023), dan UNICEF Programming Guidance (2020).</p>`},
 {id:12, judul:"Imunisasi Anak", ringkas:"Mengapa imunisasi penting, jadwal imunisasi rutin 0–24 bulan, dan apa yang dilakukan setelah imunisasi.", isi:`
  <p class="inti">Imunisasi membuat tubuh anak kebal terhadap penyakit berbahaya. Anak yang jarang sakit nafsu makannya lebih terjaga, sehingga gizi dari MP-ASI dapat dipakai untuk tumbuh, bukan habis untuk melawan penyakit.</p>
  <h3>Mengapa imunisasi penting?</h3>
  <ul><li>Melindungi anak dari penyakit yang dapat menyebabkan cacat atau kematian, seperti <b>campak, polio, difteri, batuk rejan (pertusis), hepatitis B, TBC, radang paru (pneumonia), dan diare berat akibat rotavirus</b>.</li>
  <li>Anak yang sering sakit, terutama diare dan infeksi saluran napas, mudah kehilangan nafsu makan dan berat badan. Bila terjadi berulang, pertumbuhannya dapat terganggu.</li>
  <li>Bila banyak anak di desa sudah diimunisasi, penyakit lebih sulit menyebar, sehingga bayi yang belum cukup umur ikut terlindungi.</li></ul>
  <h3>Jadwal imunisasi rutin anak 0–24 bulan</h3>
  <div class="tbl"><table class="imun"><thead><tr><th>Umur</th><th>Imunisasi</th></tr></thead><tbody>
  <tr><td>&lt; 24 jam</td><td>Hepatitis B (HB-0)</td></tr>
  <tr><td>1 bulan</td><td>BCG, Polio tetes 1</td></tr>
  <tr><td>2 bulan</td><td>DPT-HB-Hib 1, Polio tetes 2, PCV 1, Rotavirus 1</td></tr>
  <tr><td>3 bulan</td><td>DPT-HB-Hib 2, Polio tetes 3, PCV 2, Rotavirus 2</td></tr>
  <tr><td>4 bulan</td><td>DPT-HB-Hib 3, Polio tetes 4, Polio suntik (IPV) 1, Rotavirus 3</td></tr>
  <tr><td>9 bulan</td><td>Campak-Rubela (MR), Polio suntik (IPV) 2</td></tr>
  <tr><td>10 bulan</td><td>JE (hanya di daerah tertentu)</td></tr>
  <tr><td>12 bulan</td><td>PCV 3</td></tr>
  <tr><td>18 bulan</td><td>DPT-HB-Hib lanjutan, Campak-Rubela (MR) lanjutan</td></tr>
  </tbody></table></div>
  <p class="catatan">Polio tetes pertama dapat diberikan sejak lahir sampai umur 1 bulan. Jadwal di posyandu atau puskesmas dapat disesuaikan petugas, jadi ikuti jadwal yang tertulis di Buku KIA anak.</p>
  <div class="dua"><div class="box ya"><h3>Gratis</h3><p>Imunisasi rutin <b>gratis</b> di posyandu, puskesmas, dan fasilitas kesehatan pemerintah.</p></div><div class="box ya"><h3>Bawa Buku KIA</h3><p>Setiap imunisasi <b>dicatat di Buku KIA</b>. Simpan baik-baik dan bawa setiap ke posyandu.</p></div></div>
  <h3>Bila imunisasi terlambat</h3>
  <p>Jangan khawatir dan jangan berhenti. Bawa anak ke posyandu atau puskesmas untuk <b>imunisasi kejar</b>. Petugas akan melanjutkan dosis yang tertinggal tanpa harus mengulang dari awal.</p>
  <h3>Setelah imunisasi</h3>
  <div class="box ya"><h3>Reaksi ringan yang wajar (biasanya hilang dalam 1–2 hari)</h3><ul><li>Demam ringan, anak rewel.</li><li>Nyeri, merah, atau bengkak di bekas suntikan.</li><li>Pada BCG, beberapa minggu kemudian muncul <b>bisul kecil</b> di lengan yang lalu sembuh dan meninggalkan bekas. Ini tanda imunisasi berhasil; jangan dipencet atau diberi apa-apa.</li></ul></div>
  <ul><li>Tetap <b>berikan ASI dan MP-ASI</b> seperti biasa, lebih sering bila anak rewel.</li><li>Kompres bekas suntikan dengan <b>air biasa</b> bila nyeri atau bengkak.</li><li>Obat penurun panas hanya sesuai anjuran petugas kesehatan.</li></ul>
  <div class="box tidak"><h3>Segera ke puskesmas bila</h3><p>Anak demam tinggi, kejang, sesak napas, bengkak di bekas suntikan makin meluas, menangis terus lebih dari 3 jam, atau tampak sangat lemas.</p></div>
  <h3>Bolehkah imunisasi saat anak sakit?</h3>
  <p>Sakit ringan seperti batuk pilek tanpa demam tinggi umumnya <b>tidak menjadi halangan</b>. Sampaikan keadaan anak kepada petugas; petugas yang akan memutuskan imunisasi diberikan hari itu atau ditunda.</p>
  <div class="ingat"><h3>Ingat ya, Bu</h3><ul><li>Imunisasi melindungi anak dari penyakit berbahaya dan membantu anak <b>tumbuh optimal</b>.</li><li>Lengkapi imunisasi <b>sesuai jadwal di Buku KIA</b>, gratis di posyandu dan puskesmas.</li><li>Terlambat? Tetap datang untuk <b>imunisasi kejar</b>.</li><li>Demam ringan dan bengkak setelah imunisasi itu wajar; <b>ASI tetap diberikan</b>.</li></ul></div>
  <p class="catatan">Sumber: Keputusan Menteri Kesehatan No. HK.01.07/MENKES/1098/2024 tentang Jenis dan Jadwal Imunisasi Program, dan Buku KIA (Kemenkes RI, 2024).</p>`}



];

}
app.addEventListener("click",e=>{
